<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Veilnet Device Login</title>
  <link rel="icon" href="assets/Veilnet.png">
  <link rel="stylesheet" href="assets/veilnet.css">
</head>
<body>
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/veilnet.js"></script>
  <script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const userCode = params.get('user_code') || params.get('userCode') || '';
    const deviceCode = params.get('device_code') || params.get('deviceCode') || '';

    if (!userCode || !deviceCode) {
      document.body.textContent = 'Missing login codes. Please return to the launcher and try again.';
      return;
    }

    // Redirect to Supabase device authorization
    window.location.href = `${VEILNET_CONFIG.SUPABASE_URL}/functions/v1/veilnet-auth/device/verify?user_code=${encodeURIComponent(userCode)}&device_code=${encodeURIComponent(deviceCode)}`;
  })();
</script>
</body>
</html>
