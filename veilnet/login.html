<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Veilnet • Login</title>
  <link rel="icon" href="../assets/Veilnet.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/Veilnet.png">
  <meta name="theme-color" content="#7c5cff">
  <link rel="stylesheet" href="assets/veilnet.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <a href="./" style="display:flex; align-items:center; gap:12px">
          <span style="font-weight:1000">LatticeVeil</span>
          <span class="brand-badge">Veilnet</span>
        </a>
      </div>
      <nav class="nav" aria-label="Primary">
        <a href="./">Home</a>
        <a href="./community/">Community</a>
        <a href="./messages/">Messages</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 18px 0 34px">
    <div style="max-width: 400px; margin: 0 auto; text-align: center;">
      <div style="margin-bottom: 2rem;">
        <img src="assets/Veilnet V1.png" alt="Veilnet" style="height: 60px;">
        <h1 style="margin: 1rem 0 0.5rem;">Veilnet</h1>
        <p style="color: var(--muted);">Sign in to access the Veilnet social platform</p>
      </div>

      <div id="gsi-button" style="margin: 2rem 0;"></div>
      
      <div id="login-error" style="color: var(--red); margin: 1rem 0; display: none;"></div>

      <div style="margin-top: 3rem;">
        <a href="./" style="color: var(--accent); text-decoration: none;">← Back to Veilnet</a>
      </div>
    </div>
  </main>

  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/veilnet.js"></script>
  
  <script>
    window.addEventListener("load", async () => {
      try {
        if (!window.google || !google.accounts || !google.accounts.id) {
          throw new Error("Google Identity Services failed to load.");
        }

        google.accounts.id.initialize({
          client_id: VEILNET_CONFIG.GOOGLE_CLIENT_ID,
          callback: async (resp) => {
            const result = await VeilnetAuth.signInWithGoogleIdToken(resp.credential);
            if (result?.error) {
              document.getElementById("login-error").textContent = result.error.message;
              document.getElementById("login-error").style.display = "block";
              return;
            }
            window.location.href = "/veilnet/";
          }
        });

        google.accounts.id.renderButton(
          document.getElementById("gsi-button"),
          { theme: "outline", size: "large", shape: "pill" }
        );
      } catch (e) {
        document.getElementById("login-error").textContent = e.message || String(e);
        document.getElementById("login-error").style.display = "block";
      }
    });
  </script>
</body>
</html>
