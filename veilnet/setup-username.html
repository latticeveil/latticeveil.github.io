<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Username - Veilnet</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/veilnet.css">
    <style>
        body {
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .setup-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .setup-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .setup-header h1 {
            margin: 0 0 0.5rem 0;
            color: var(--cyan);
        }
        .setup-header p {
            margin: 0;
            opacity: 0.8;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 2px rgba(56, 225, 255, 0.2);
        }
        .error {
            color: #ff4444;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            background: var(--cyan);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .submit-btn:hover {
            background: #4dd4ff;
            transform: translateY(-1px);
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .username-rules {
            font-size: 0.875rem;
            opacity: 0.7;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <!-- Content will be replaced by JavaScript -->
    </div>

    <script>
        // Login functionality disabled
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.setup-container');
            container.innerHTML = `
                <div class="setup-header">
                    <h1>Login Disabled</h1>
                    <p>Login functionality has been disabled for this site.</p>
                </div>
                <div style="text-align: center; margin-top: 2rem;">
                    <a href="../" class="submit-btn" style="display: inline-block; text-decoration: none; width: auto; padding: 0.875rem 2rem;">
                        Back to Veilnet
                    </a>
                </div>
            `;
        });
    </script>
</body>
</html>
