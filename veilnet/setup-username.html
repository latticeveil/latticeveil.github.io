<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Username - Veilnet</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/veilnet.css">
    <style>
        body {
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .setup-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .setup-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .setup-header h1 {
            margin: 0 0 0.5rem 0;
            color: var(--cyan);
        }
        .setup-header p {
            margin: 0;
            opacity: 0.8;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 2px rgba(56, 225, 255, 0.2);
        }
        .error {
            color: #ff4444;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            background: var(--cyan);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .submit-btn:hover {
            background: #4dd4ff;
            transform: translateY(-1px);
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .username-rules {
            font-size: 0.875rem;
            opacity: 0.7;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="setup-header">
            <h1>Choose Your Username</h1>
            <p>This is how other users will see you on Veilnet</p>
        </div>
        
        <form id="usernameForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Enter username"
                    pattern="[a-zA-Z0-9_-]{3,20}"
                    required
                    autocomplete="off"
                >
                <div class="username-rules">
                    3-20 characters • Letters, numbers, underscores, hyphens
                </div>
                <div class="error" id="errorMessage"></div>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">
                Continue to Veilnet
            </button>
        </form>
    </div>

    <script>
        // Initialize Supabase client
        const supabase = window.supabase.createClient(
            'https://lqghurvonrvrxfwjgkuu.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlbiI6Imd1ZWQnZXItYmUiLCJpc3MiOiJzdXBhYmFzZSIsInJlbiIsInR5cCI6ImlhdCI6MTczOTg0MTYwMDAwMH0.9oJv3M7vQWzjRQ9a_0L5mYJjJ5k5J5k5J5k5J5k5J5k5J5k5J5k5J5k'
        );

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const oauthCode = urlParams.get('code');
        
        // Handle OAuth code from consent page
        if (oauthCode && !userId) {
            // Exchange OAuth code for session
            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        skipBrowserRedirect: true,
                        flowType: 'pkce',
                        queryParams: {
                            code: oauthCode
                        }
                    }
                });
                
                if (error) {
                    console.error('OAuth exchange error:', error);
                    errorMsg.textContent = 'Authentication failed';
                    errorMsg.style.display = 'block';
                    return;
                }
                
                if (data?.user) {
                    userId = data.user.id;
                }
            } catch (error) {
                console.error('OAuth processing error:', error);
                errorMsg.textContent = 'Authentication failed';
                errorMsg.style.display = 'block';
                return;
            }
        }
        
        if (!userId) {
            window.location.href = 'index.html';
        }
        
        document.getElementById('usernameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMessage');
            
            if (!username) {
                errorMsg.textContent = 'Please enter a username';
                errorMsg.style.display = 'block';
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Setting username...';
            errorMsg.style.display = 'none';
            
            try {
                // Check if username is already taken
                const { data: existingUser } = await supabase
                    .from('users')
                    .select('id')
                    .eq('username', username)
                    .single();
                
                if (existingUser) {
                    errorMsg.textContent = 'Username already taken';
                    errorMsg.style.display = 'block';
                    return;
                }
                
                // Update user profile with username
                const { data: { user } } = await supabase.auth.getUser();
                
                const { error } = await supabase
                    .from('users')
                    .upsert({
                        id: user.id,
                        username: username,
                        email: user.email,
                        name: user.user_metadata?.name || user.email,
                        picture: user.user_metadata?.picture,
                        updated_at: new Date().toISOString()
                    });
                
                if (error) {
                    throw error;
                }
                
                // Username set successfully, redirect to main app
                window.location.href = `https://latticeveil.github.io/veilnet/index.html?login=success`;
                
            } catch (error) {
                console.error('Username setup error:', error);
                errorMsg.textContent = error.message || 'Failed to set username';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Continue to Veilnet';
            }
        });
        
        // Real-time validation
        document.getElementById('username').addEventListener('input', (e) => {
            const username = e.target.value;
            const errorMsg = document.getElementById('errorMessage');
            
            if (username.length < 3) {
                errorMsg.textContent = 'Username must be at least 3 characters';
                errorMsg.style.display = 'block';
            } else if (username.length > 20) {
                errorMsg.textContent = 'Username must be 20 characters or less';
                errorMsg.style.display = 'block';
            } else if (!/^[a-zA-Z0-9_-]+$/.test(username)) {
                errorMsg.textContent = 'Username can only contain letters, numbers, underscores, and hyphens';
                errorMsg.style.display = 'block';
            } else {
                errorMsg.style.display = 'none';
            }
        });
    </script>
</body>
</html>
