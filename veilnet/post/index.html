<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Veilnet • Post</title>
  <link rel="icon" href="../assets/Veilnet.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/Veilnet.png">
  <meta name="theme-color" content="#7c5cff">
  <link rel="stylesheet" href="../assets/veilnet.css?v=18">
  <link rel="stylesheet" href="/assets/tos-modal.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <a href="../" style="display:flex; align-items:center; gap:12px">
          <span style="font-weight:1000">LatticeVeil</span>
          <span class="brand-badge">Veilnet</span>
        </a>
      </div>

      <nav class="nav" aria-label="Primary">
        <a href="/veilnet/">Home</a>
        <a href="/veilnet/community/">Community</a>
        <a href="/veilnet/accomplishments/">Accomplishments</a>
        <a href="/veilnet/messages/" class="nav-messages">Friends<span id="vnUnreadBadgeMessages" class="vn-badge vn-badge--hidden"></span></a>
              <a href="/veilnet/admin/" data-veil-admin-nav>Admin</a>
</nav>

      <div class="right">
                <div class="vn-search" data-veil-search>
          <input class="vn-search-input" type="text" placeholder="Search players" autocomplete="off" spellcheck="false" aria-label="Search players">
          <div class="vn-search-results"></div>
        </div>
<div class="pfp-wrap">
          <div class="avatar" data-veil-avatar title="Profile">
            <img data-veil-avatar-img src="../assets/default_pfp.png" alt="profile">
            <span id="vnUnreadBadgeProfile" class="vn-badge vn-badge--hidden"></span>
          </div>
          <div class="status-ring" data-veil-ring style="--ring: rgba(255,255,255,.25); opacity:.55"></div>

          <div class="dropdown" data-veil-dropdown>
            <div class="dd-head">
              <img data-veil-dd-img src="../assets/default_pfp.png" alt="">
              <div>
                <div class="dd-title" data-veil-dd-title>Not signed in</div>
                <div class="dd-sub" data-veil-dd-sub>Login to access Veilnet features</div>
              </div>
            </div>

            <div class="dd-item" onclick="location.href='../'">
              <span>Go to Veilnet</span><small>Home</small>
            </div>

            <div class="dd-item" onclick="location.href='/veilnet/messages/'">
              <span>Friends</span><small>Chat</small>
            </div>


            <div class="dd-item" onclick="location.href='/veilnet/skin/'">
              <span>Game Skin</span><small>Editor</small>
            </div>
            <div class="dd-item" data-veil-myprofile style="display:none">
              <span>My Profile</span><small>/profile</small>
            </div>

            <div class="dd-item" data-veil-settings style="display:none">
              <span>Settings</span><small>Link + prefs</small>
            </div>

            <div class="dd-divider"></div>

            <div class="dd-item" data-veil-login>
              <span>Login with Google</span><small>Veilnet</small>
            </div>

            <div class="dd-item" data-veil-logout style="display:none">
              <span>Log Out</span><small>Veilnet</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  
<main class="container" style="padding: 18px 0 34px">
  <div data-veil-post></div>
</main>


  <footer class="footer">
    <div class="container">
      LatticeVeil • Veilnet
    </div>
  </footer>

  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/config.js"></script>
  <script src="../assets/auth.js"></script>
  <script src="../assets/veilnet-boot.js?v=18"></script>
    <script src="../assets/veilnet.js?v=18"></script>
  <script src="/assets/tos-acceptance.js"></script>
</body>
</html>
