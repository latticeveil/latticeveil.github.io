services:
  - type: web
    name: veilnet-auth
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RENDER_EXTERNAL_URL
        value: https://veilnet-auth.onrender.com
      - key: FRONTEND_URL
        value: https://latticeveil.github.io/veilnet/
