<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Veilnet</title>
  <link rel="stylesheet" href="../assets/veilnet.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <nav>
      <a href="../supabase-index.html">Veilnet</a>
      <a href="../community/index.html">Community</a>
      <a href="../worlds/index.html" onclick="alert('Demo page not included yet.'); return false;">Worlds</a>
      <a href="../leaderboards/index.html" onclick="alert('Demo page not included yet.'); return false;">Leaderboards</a>
      <a href="../messages/index.html">Messages</a>
    </nav>

    <div class="right">
      <div class="pfp-wrap">
        <div class="avatar" data-veil-avatar title="Profile">
          <img data-veil-avatar-img src="../assets/default_pfp.png" alt="profile">
          <span id="vnUnreadBadgeProfile" class="vn-badge vn-badge--hidden"></span>
        </div>
        <div class="status-ring" data-veil-ring style="--ring: rgba(255,255,255,.25); opacity:.55"></div>

        <div class="dropdown" data-veil-dropdown>
          <div class="dd-head">
            <img data-veil-dd-img src="../assets/default_pfp.png" alt="">
            <div>
              <div class="dd-title" data-veil-dd-title>Not signed in</div>
              <div class="dd-sub" data-veil-dd-sub>Sign in to access Veilnet</div>
            </div>
          </div>

          <div id="auth-signed-out" class="auth-section">
            <div class="dd-item" onclick="signInWithGoogle()">
              <span>Sign in with Google</span><small>Secure OAuth</small>
            </div>
          </div>

          <div id="auth-signed-in" class="auth-section" style="display:none;">
            <div class="dd-item" onclick="location.href='../supabase-index.html'">
              <span>Go to Veilnet</span><small>Home</small>
            </div>
            <div class="dd-item" onclick="location.href='../messages/index.html'">
              <span>Messages</span><small>Chat</small>
            </div>
            <div class="dd-item" onclick="location.href='index.html'">
              <span>My Profile</span><small>/profile</small>
            </div>
            <div class="dd-item" onclick="location.href='../settings/index.html'">
              <span>Settings</span><small>Account</small>
            </div>
            <div class="dd-divider"></div>
            <div class="dd-item" onclick="signOut()">
              <span>Sign Out</span><small>Secure logout</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="auth-loading" class="auth-loading" style="display:none;">
      <div class="loading-spinner"></div>
      <div>Loading...</div>
    </div>

    <div id="auth-content">
      <!-- Profile will be loaded here -->
    </div>
  </main>

  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/supabase-auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await veilnetAuth.init();
        
        veilnetAuth.onAuthChange = (user) => {
          updateAuthUI(user);
        };
        
        updateAuthUI(veilnetAuth.getCurrentUser());
        
      } catch (error) {
        console.error('Failed to initialize profile:', error);
        showError('Failed to load profile. Please refresh.');
      }
    });

    function updateAuthUI(user) {
      const signedOut = document.getElementById('auth-signed-out');
      const signedIn = document.getElementById('auth-signed-in');
      const ddTitle = document.querySelector('[data-veil-dd-title]');
      const ddSub = document.querySelector('[data-veil-dd-sub]');
      const avatarImg = document.querySelector('[data-veil-avatar-img]');
      const ddImg = document.querySelector('[data-veil-dd-img]');
      
      if (user) {
        signedOut.style.display = 'none';
        signedIn.style.display = 'block';
        ddTitle.textContent = user.user_metadata?.display_name || user.email || 'User';
        ddSub.textContent = 'Account settings';
        
        if (user.user_metadata?.avatar_url) {
          avatarImg.src = user.user_metadata.avatar_url;
          ddImg.src = user.user_metadata.avatar_url;
        }
        
        loadProfile(user);
      } else {
        signedOut.style.display = 'block';
        signedIn.style.display = 'none';
        ddTitle.textContent = 'Not signed in';
        ddSub.textContent = 'Sign in to access Veilnet';
        avatarImg.src = '../assets/default_pfp.png';
        ddImg.src = '../assets/default_pfp.png';
        
        loadAuthRequired();
      }
    }

    async function loadProfile(user) {
      const contentEl = document.getElementById('auth-content');
      
      try {
        const profile = await veilnetAuth.getUserProfile();
        
        contentEl.innerHTML = `
          <div class="panel">
            <h2>Profile</h2>
            <div style="display:grid; grid-template-columns:200px 1fr; gap:24px;">
              <div>
                <h3>Avatar</h3>
                <div style="text-align:center; margin-bottom:16px;">
                  <img id="profile-avatar" src="${profile?.avatar_url || '../assets/default_pfp.png'}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid var(--border);">
                </div>
                <input type="file" id="avatar-input" accept="image/*" style="display:none;">
                <button onclick="document.getElementById('avatar-input').click()" style="margin-top:8px;">Change Avatar</button>
              </div>
              
              <div>
                <h3>Display Name</h3>
                <input type="text" id="display-name" value="${profile?.display_name || ''}" placeholder="Enter display name" style="width:100%; padding:8px; margin-bottom:8px;">
              </div>
              
              <div>
                <h3>Bio</h3>
                <textarea id="bio" placeholder="Tell us about yourself..." style="width:100%; height:80px; padding:8px; resize:vertical; margin-bottom:16px;">${profile?.bio || ''}</textarea>
              </div>
              
              <div>
                <button onclick="updateProfile()" style="width:100%;">Save Profile</button>
              </div>
            </div>
          </div>
        `;
        
        // Setup avatar upload
        document.getElementById('avatar-input').addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          
          // This would need a proper file upload service
          // For now, just show a placeholder
          alert('Avatar upload would be implemented with a file service like Supabase Storage');
        });
        
      } catch (error) {
        console.error('Failed to load profile:', error);
        showError('Failed to load profile. Please refresh.');
      }
    }

    async function updateProfile() {
      try {
        const displayName = document.getElementById('display-name').value;
        const bio = document.getElementById('bio').value;
        
        await veilnetAuth.updateProfile({
          display_name: displayName,
          bio: bio
        });
        
        alert('Profile updated successfully!');
      } catch (error) {
        console.error('Failed to update profile:', error);
        showError('Failed to update profile. Please try again.');
      }
    }

    function signInWithGoogle() {
      window.location.href = '../supabase-index.html';
    }

    function signOut() {
      window.location.href = '../supabase-index.html';
    }

    function showError(message) {
      const contentEl = document.getElementById('auth-content');
      contentEl.innerHTML = `
        <div class="panel" style="border-color: #ff4444; max-width:400px; margin:0 auto;">
          <div style="color: #ff4444; font-weight: bold; margin-bottom:8px;">Error</div>
          <div>${message}</div>
        </div>
      `;
    }
  </script>
</body>
</html>
