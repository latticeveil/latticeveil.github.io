<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Veilnet</title>
  <link rel="stylesheet" href="../assets/veilnet.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <nav>
      <a href="../supabase-index.html">Veilnet</a>
      <a href="../community/index.html">Community</a>
      <a href="../worlds/index.html" onclick="alert('Demo page not included yet.'); return false;">Worlds</a>
      <a href="../leaderboards/index.html" onclick="alert('Demo page not included yet.'); return false;">Leaderboards</a>
      <a href="index.html">Messages</a>
    </nav>

    <div class="right">
      <div class="pfp-wrap">
        <div class="avatar" data-veil-avatar title="Profile">
          <img data-veil-avatar-img src="../assets/default_pfp.png" alt="profile">
          <span id="vnUnreadBadgeProfile" class="vn-badge vn-badge--hidden"></span>
        </div>
        <div class="status-ring" data-veil-ring style="--ring: rgba(255,255,255,.25); opacity:.55"></div>

        <div class="dropdown" data-veil-dropdown>
          <div class="dd-head">
            <img data-veil-dd-img src="../assets/default_pfp.png" alt="">
            <div>
              <div class="dd-title" data-veil-dd-title>Not signed in</div>
              <div class="dd-sub" data-veil-dd-sub>Sign in to access Veilnet</div>
            </div>
          </div>

          <div id="auth-signed-out" class="auth-section">
            <div class="dd-item" onclick="signInWithGoogle()">
              <span>Sign in with Google</span><small>Secure OAuth</small>
            </div>
          </div>

          <div id="auth-signed-in" class="auth-section" style="display:none;">
            <div class="dd-item" onclick="location.href='../supabase-index.html'">
              <span>Go to Veilnet</span><small>Home</small>
            </div>
            <div class="dd-item" onclick="location.href='index.html'">
              <span>Messages</span><small>Chat</small>
            </div>
            <div class="dd-item" onclick="location.href='../profile/index.html'">
              <span>My Profile</span><small>/profile</small>
            </div>
            <div class="dd-item" onclick="location.href='../settings/index.html'">
              <span>Settings</span><small>Account</small>
            </div>
            <div class="dd-divider"></div>
            <div class="dd-item" onclick="signOut()">
              <span>Sign Out</span><small>Secure logout</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="auth-loading" class="auth-loading" style="display:none;">
      <div class="loading-spinner"></div>
      <div>Loading...</div>
    </div>

    <div id="auth-content">
      <!-- Messages will be loaded here -->
    </div>
  </main>

  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/supabase-auth.js"></script>
  <script src="../assets/supabase-messaging.js"></script>
  <script>
    let currentConversationId = null;
    let conversations = new Map();

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Initialize auth and messaging
        await veilnetAuth.init();
        await veilnetMessaging.init();
        
        // Set up auth change handler
        veilnetAuth.onAuthChange = (user) => {
          updateAuthUI(user);
          if (!user) {
            loadAuthRequired();
          } else {
            loadMessagesInterface();
          }
        };
        
        // Set up messaging handlers
        veilnetMessaging.on('conversationsChanged', (convs) => {
          conversations = new Map(convs.map(c => [c.id, c]));
          renderConversationList(convs);
        });
        
        veilnetMessaging.on('newMessage', (message) => {
          if (message.conversation_id === currentConversationId) {
            addMessageToChat(message);
          }
        });
        
        // Initial UI update
        updateAuthUI(veilnetAuth.getCurrentUser());
        
      } catch (error) {
        console.error('Failed to initialize messages:', error);
        showError('Failed to load messages. Please refresh.');
      }
    });

    // Update auth UI
    function updateAuthUI(user) {
      const signedOut = document.getElementById('auth-signed-out');
      const signedIn = document.getElementById('auth-signed-in');
      const ddTitle = document.querySelector('[data-veil-dd-title]');
      const ddSub = document.querySelector('[data-veil-dd-sub]');
      const avatarImg = document.querySelector('[data-veil-avatar-img]');
      const ddImg = document.querySelector('[data-veil-dd-img]');
      
      if (user) {
        signedOut.style.display = 'none';
        signedIn.style.display = 'block';
        ddTitle.textContent = user.user_metadata?.display_name || user.email || 'User';
        ddSub.textContent = 'Account settings';
        
        if (user.user_metadata?.avatar_url) {
          avatarImg.src = user.user_metadata.avatar_url;
          ddImg.src = user.user_metadata.avatar_url;
        }
      } else {
        signedOut.style.display = 'block';
        signedIn.style.display = 'none';
        ddTitle.textContent = 'Not signed in';
        ddSub.textContent = 'Sign in to access Veilnet';
        avatarImg.src = '../assets/default_pfp.png';
        ddImg.src = '../assets/default_pfp.png';
      }
    }

    // Load auth required screen
    function loadAuthRequired() {
      const contentEl = document.getElementById('auth-content');
      contentEl.innerHTML = `
        <div class="panel" style="text-align:center; padding:48px;">
          <h3>Authentication Required</h3>
          <div class="small">Please sign in to access messages.</div>
          <button onclick="signInWithGoogle()" style="margin-top:16px;">
            <span style="display:flex; align-items:center; gap:8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">

                </svg>
                Sign in with Google
              </span>
            </button>
          </div>
        </div>
      `;
    }

    // Load messages interface
    function loadMessagesInterface() {
      const contentEl = document.getElementById('auth-content');
      contentEl.innerHTML = `
        <div style="display:grid; grid-template-columns:300px 1fr; gap:24px; height:calc(100vh - 120px);">
          <div class="panel">
            <h3>Conversations</h3>
            <div id="conversation-list" style="max-height:calc(100vh - 200px); overflow-y:auto;">
              <div class="small">Loading conversations...</div>
            </div>
          </div>
          <div class="panel">
            <h3>Chat</h3>
            <div id="chat-panel" style="height:calc(100vh - 200px); display:flex; flex-direction:column;">
              <div id="no-conversation-selected" style="display:flex; align-items:center; justify-content:center; height:100%; color:#888;">
                Select a conversation to start chatting
              </div>
              <div id="messages-container" style="display:none; flex:1; flex-direction:column; height:100%; overflow-y:auto;">
                <!-- Messages will be loaded here -->
              </div>
              <div id="message-input-container" style="display:none; border-top:1px solid var(--border); padding:16px;">
                <input type="text" id="message-input" placeholder="Type a message..." style="flex:1; border:none; background:transparent; outline:none; color:var(--text); font-size:14px;">
                <button onclick="sendMessage()" style="margin-left:12px;">Send</button>
              </div>
            </div>
          </div>
        </div>
      `;

      // Load conversations
      loadConversations();
    }

    // Load conversations
    async function loadConversations() {
      try {
        const conversations = await veilnetMessaging.getConversations();
        renderConversationList(conversations);
      } catch (error) {
        console.error('Failed to load conversations:', error);
        showError('Failed to load conversations. Please refresh.');
      }
    }

    // Render conversation list
    function renderConversationList(convs) {
      const listEl = document.getElementById('conversation-list');
      if (!listEl) return;

      if (convs.length === 0) {
        listEl.innerHTML = '<div class="small">No conversations yet. Start one!</div>';
        return;
      }

      listEl.innerHTML = convs.map(conv => {
        const otherUser = conv.participants.find(p => p !== veilnetAuth.getCurrentUser()?.id);
        const lastMsg = conv.last_message;
        const preview = lastMsg ? `${lastMsg.sender?.username}: ${lastMsg.content.substring(0, 50)}${lastMsg.content.length > 50 ? '...' : ''}` : '';
        
        return `
          <div class="conversation-item" onclick="selectConversation('${conv.id}')" style="cursor:pointer; padding:16px; border-bottom:1px solid var(--border); transition:background 0.2s;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:600; color:var(--text);">${otherUser?.username || 'Unknown'}</div>
                <div class="small">${preview}</div>
              </div>
              <div class="small" style="color:#888;">${new Date(conv.updated_at).toLocaleString()}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Select conversation
    async function selectConversation(conversationId) {
      currentConversationId = conversationId;
      
      try {
        // Load messages
        const messages = await veilnetMessaging.getMessages(conversationId);
        renderMessages(messages);
        
        // Mark messages as read
        await veilnetMessaging.markMessagesRead(conversationId);
        
        // Update UI
        document.getElementById('no-conversation-selected').style.display = 'none';
        document.getElementById('messages-container').style.display = 'flex';
        document.getElementById('message-input-container').style.display = 'flex';
        
        // Update conversation list selection
        document.querySelectorAll('.conversation-item').forEach(item => {
          item.style.background = item.onclick.toString().includes(conversationId) ? 'var(--panel)' : 'transparent';
        });
        
      } catch (error) {
        console.error('Failed to select conversation:', error);
        showError('Failed to load conversation. Please refresh.');
      }
    }

    // Render messages
    function renderMessages(messages) {
      const container = document.getElementById('messages-container');
      if (!container) return;

      if (messages.length === 0) {
        container.innerHTML = '<div class="small" style="text-align:center; padding:32px;">No messages yet</div>';
        return;
      }

      container.innerHTML = messages.map(msg => {
        const isOwn = msg.sender_id === veilnetAuth.getCurrentUser()?.id;
        const time = new Date(msg.created_at).toLocaleTimeString();
        
        return `
          <div class="message" style="margin:8px 0; padding:12px; border-radius:12px; ${isOwn ? 'background:var(--panel); margin-left:auto;' : 'background:var(--border);'}">
            <div style="display:flex; align-items:flex-start; gap:8px;">
              <img src="${msg.sender?.avatar_url || '../assets/default_pfp.png'}" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">
              <div>
                <div style="font-weight:600; color:var(--text);">${msg.sender?.username || 'Unknown'}</div>
                <div class="small" style="color:#888;">${time}</div>
              </div>
              <div style="flex:1; color:var(--text); word-wrap:break-word;">${msg.content}</div>
            </div>
          </div>
        `;
      }).join('');

      // Scroll to bottom
      container.scrollTop = container.scrollHeight;
    }

    // Send message
    async function sendMessage() {
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      
      if (!content) return;
      
      try {
        await veilnetMessaging.sendMessage(currentConversationId, content);
        input.value = '';
      } catch (error) {
        console.error('Failed to send message:', error);
        showError('Failed to send message. Please try again.');
      }
    }

    // Sign in with Google
    async function signInWithGoogle() {
      const loadingEl = document.getElementById('auth-loading');
      const contentEl = document.getElementById('auth-content');
      
      try {
        loadingEl.style.display = 'block';
        contentEl.style.display = 'none';
        
        await veilnetAuth.signInWithGoogle();
        
      } catch (error) {
        console.error('Sign in failed:', error);
        showError('Failed to sign in with Google. Please try again.');
      } finally {
        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';
      }
    }

    // Sign out
    async function signOut() {
      try {
        await veilnetAuth.signOut();
        window.location.href = '../supabase-index.html';
      } catch (error) {
        console.error('Sign out failed:', error);
        showError('Failed to sign out. Please try again.');
      }
    }

    // Show error
    function showError(message) {
      const contentEl = document.getElementById('auth-content');
      contentEl.innerHTML = `
        <div class="panel" style="border-color: #ff4444; max-width:400px; margin:0 auto;">
          <div style="color: #ff4444; font-weight: bold; margin-bottom:8px;">Error</div>
          <div>${message}</div>
        </div>
      `;
    }
  </script>
</body>
</html>
